name: Update MRS rulesets

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-rulesets.yml"
      - "scripts/update-rulesets.sh"
      - "sources.json"

permissions:
  contents: write

concurrency:
  group: update-mrs-rulesets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MIHOMO_VERSION: v1.19.27
      MIHOMO_ARCHIVE_SHA256: fb3e34c55844f389ff54679e5a3aec331d5ec38006c20f8dcc476fb47768a58f

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Mihomo converter
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mihomo.gz"
          binary="$RUNNER_TEMP/mihomo"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MIHOMO_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          gzip --decompress --stdout "$archive" > "$binary"
          chmod 0755 "$binary"
          "$binary" -v
          printf 'MIHOMO_BIN=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Build and validate rulesets
        id: update
        run: ./scripts/update-rulesets.sh

      - name: Check generated diff
        if: steps.update.outputs.changed == 'true'
        run: git diff --check

      - name: Commit updated artifacts
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rules/*.mrs rules/*.json rules/SHA256SUMS
          git commit -m "Update generated MRS rulesets"
          git push

      - name: Publish rolling release
        if: steps.update.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling \
              rules/*.mrs \
              rules/*.json \
              rules/SHA256SUMS \
              --clobber
          else
            gh release create rolling \
              rules/*.mrs \
              rules/*.json \
              rules/SHA256SUMS \
              --title "Rolling MRS rulesets" \
              --notes "Generated from the canonical sources declared in sources.json."
          fi
